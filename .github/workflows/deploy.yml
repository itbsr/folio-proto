name: Deploy

# Deploy model:
#   release  -> production: stable Worker (my-app-backend) + grad-proto-db   + Pages production
#   main     -> staging:    per-version preview URL (-e staging)             + grad-proto-db-staging + Pages preview
#   PR       -> preview:    per-version preview URL (no migration, shared staging DB)
# Migrations run ONLY on release/main so the staging schema advances on a single line.

on:
  push:
    branches: [release, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck gate (blocks every deploy) ──────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # ── Production (release) ──────────────────────────────────────────────────
  production:
    needs: ci
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Apply D1 migrations (production)
        working-directory: packages/backend
        run: npx wrangler d1 migrations apply grad-proto-db --remote

      - name: Deploy backend (production)
        working-directory: packages/backend
        run: npx wrangler deploy --minify src/index.ts

      - name: Build frontend
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy frontend (production)
        run: npx wrangler pages deploy packages/frontend/dist --project-name=grad-proto --branch=release

  # ── Staging (main) — per-version preview URL + staging D1 ─────────────────
  staging:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Apply D1 migrations (staging)
        working-directory: packages/backend
        run: npx wrangler d1 migrations apply grad-proto-db-staging --remote --env staging

      - name: Upload backend version (staging) and capture preview URL
        id: upload
        working-directory: packages/backend
        run: |
          out=$(npx wrangler versions upload --env staging --message "main@${GITHUB_SHA}" 2>&1)
          echo "$out"
          url=$(printf '%s\n' "$out" | grep -iE 'preview' | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          [ -z "$url" ] && url=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then echo "::error::preview URL not found in wrangler output"; exit 1; fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build frontend (pinned to this backend version)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: ${{ steps.upload.outputs.preview_url }}

      - name: Deploy frontend (staging preview)
        run: npx wrangler pages deploy packages/frontend/dist --project-name=grad-proto --branch=main

  # ── PR preview — per-version preview URL + staging D1 (NO migration) ──────
  pr-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Upload backend version (PR, no migration) and capture preview URL
        id: upload
        working-directory: packages/backend
        run: |
          out=$(npx wrangler versions upload --env staging --message "pr-${{ github.event.number }}@${GITHUB_SHA}" 2>&1)
          echo "$out"
          url=$(printf '%s\n' "$out" | grep -iE 'preview' | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          [ -z "$url" ] && url=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then echo "::error::preview URL not found in wrangler output"; exit 1; fi
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build frontend (pinned to this backend version)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: ${{ steps.upload.outputs.preview_url }}

      - name: Deploy frontend (PR preview)
        run: npx wrangler pages deploy packages/frontend/dist --project-name=grad-proto --branch=pr-${{ github.event.number }}
